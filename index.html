<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLITZ ARENA | DYNAMIC SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2ff; --bg: #0b0d11; --card: rgba(255,255,255,0.03); --border: rgba(0, 242, 255, 0.2); }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; padding: 50px; overflow-x: auto; }
        .header { text-align: center; margin-bottom: 60px; font-family: 'Syncopate'; color: var(--main); letter-spacing: 5px; }
        .bracket { display: flex; gap: 40px; align-items: flex-start; min-width: max-content; }
        .round { display: flex; flex-direction: column; width: 200px; }
        .round-title { font-family: 'Syncopate'; font-size: 10px; color: #444; margin-bottom: 20px; text-align: center; }
        .match-container { display: flex; flex-direction: column; justify-content: space-around; min-height: 800px; }
        .match { background: var(--card); border: 1px solid var(--border); border-radius: 4px; width: 180px; margin-bottom: 20px; }
        .team { padding: 12px; font-weight: bold; color: var(--main); height: 45px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .team:last-child { border: none; }
        .champ-card { border: 2px solid #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.2); }
        .champ-card .team { color: #ff0055 !important; justify-content: center; font-family: 'Syncopate'; }
    </style>
</head>
<body>
    <div class="header"><h1>BLITZ ARENA</h1></div>
    <div class="bracket" id="bUI"></div>

    <script>
        const S_ID = "158_hGCRjHiq0a-TTBOLoCg2Uu5WthdoVEe_gXWpQNws";
        async function load() {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:json`);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0,-2));
            const data = json.table.rows.map(r => r.c[0]?.v || "");
            render(data);
        }

        function render(data) {
            const ui = document.getElementById('bUI');
            ui.innerHTML = "";
            const rounds = [
                { name: "Round 1", start: 0, count: 8 },
                { name: "Quarter Finals", start: 16, count: 4 },
                { name: "Semi Finals", start: 24, count: 2 },
                { name: "Grand Final", start: 28, count: 1 },
                { name: "Champion", start: 30, count: 1, isChamp: true }
            ];

            rounds.forEach(r => {
                const roundData = data.slice(r.start, r.start + (r.isChamp ? 1 : r.count * 2));
                // ဒီ Round ထဲမှာ နာမည် အနည်းဆုံး တစ်ခုရှိမှ Round တစ်ခုလုံးကို ပေါ်စေမယ်
                if (roundData.some(name => name !== "" && name !== "TBA")) {
                    const roundDiv = document.createElement('div');
                    roundDiv.className = "round";
                    roundDiv.innerHTML = `<div class="round-title">${r.name}</div><div class="match-container" id="rc-${r.start}"></div>`;
                    ui.appendChild(roundDiv);

                    const container = document.getElementById(`rc-${r.start}`);
                    if (r.isChamp) {
                        const m = document.createElement('div');
                        m.className = "match champ-card";
                        m.innerHTML = `<div class="team">🏆 ${data[r.start]}</div>`;
                        container.appendChild(m);
                    } else {
                        for (let i = 0; i < r.count; i++) {
                            const t1 = data[r.start + (i * 2)];
                            const t2 = data[r.start + (i * 2) + 1];
                            // Match တစ်ခုမှာ အသင်း တစ်သင်းရှိတာနဲ့ အဲ့ဒီ Match ကွက်ကို ပေါ်စေမယ်
                            if (t1 || t2) {
                                const m = document.createElement('div');
                                m.className = "match";
                                m.innerHTML = `<div class="team">${t1 || "WAITING"}</div><div class="team">${t2 || "WAITING"}</div>`;
                                container.appendChild(m);
                            }
                        }
                    }
                }
            });
        }
        load(); setInterval(load, 30000);
    </script>
</body>
</html>
