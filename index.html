<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLITZ | Tournament Register</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Syncopate:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{ --c1:#00f2ff; --c2:#ff0055; --bg:#050508; }
*{margin:0;padding:0;box-sizing:border-box;}
body{ min-height:100vh; font-family:'Outfit',sans-serif; display:flex; justify-content:center; align-items:center; background: var(--bg); color:#fff; padding: 20px; overflow-x:hidden; }

/* 🌌 Animated Stars Background */
.stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.star { position: absolute; background: white; border-radius: 50%; animation: move linear infinite; }
@keyframes move { from { transform: translateY(100vh); } to { transform: translateY(-10vh); } }

.form-card { width:min(100%, 450px); background:rgba(10,10,15,0.9); backdrop-filter:blur(20px); padding:35px 25px; border-radius:35px; border: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 1; box-shadow: 0 0 40px rgba(0,0,0,1); }
h2 { font-family:'Syncopate'; text-align:center; color:var(--c1); margin-bottom:25px; font-size: 18px; letter-spacing: 2px; }

.input-group { margin-bottom: 20px; position: relative; }
label { display:block; font-size:11px; margin-bottom:8px; color:#aaa; font-weight: 700; letter-spacing: 1px; }
input, select { width:100%; padding:14px; border-radius:15px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:#fff; outline:none; transition: 0.3s; font-family: 'Outfit'; }
input:focus { border-color: var(--c1); background: rgba(0,242,255,0.05); }

.file-label { display: block; padding: 18px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; color: #888; font-size: 13px; }
.file-label:hover { border-color: var(--c1); color: var(--c1); background: rgba(0,242,255,0.05); }

button { width:100%; padding:18px; border-radius:18px; border:none; background: linear-gradient(90deg, var(--c1), var(--c2)); color:#fff; font-weight:900; cursor:pointer; margin-top:15px; font-size: 14px; letter-spacing: 1px; transition: 0.4s; }
button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,0,85,0.3); }
button:disabled { background: #444; opacity: 0.6; transform: none; }

#status { text-align:center; margin-top:20px; }
.success-card { background: rgba(0,255,136,0.1); padding: 25px; border-radius: 20px; border: 1px solid #00ff88; animation: zoomIn 0.5s ease; }
@keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div class="stars" id="star-box"></div>

<div class="form-card">
    <h2>🏆 REGISTER</h2>
    <form id="regForm">
        <div class="input-group">
            <label><i class="fas fa-user"></i> Team / Player Name</label>
            <input type="text" id="teamName" placeholder="Enter your team name" required>
        </div>
        <div class="input-group">
            <label><i class="fas fa-id-card"></i> MLBB ID (Server)</label>
            <input type="text" id="mlId" placeholder="e.g. 1036720164 (13159)" required>
        </div>
        <div class="input-group">
            <label><i class="fas fa-gamepad"></i> Match Type</label>
            <select id="matchType">
                <option value="1vs1 Solo">1 vs 1 (Solo Match)</option>
                <option value="5vs5 Squad">5 vs 5 (Squad Match)</option>
            </select>
        </div>
        <div class="input-group">
            <label><i class="fab fa-facebook-messenger"></i> Messenger / Contact</label>
            <input type="text" id="contact" placeholder="Facebook profile link or Phone" required>
        </div>
        <div class="input-group">
            <label><i class="fas fa-receipt"></i> Payment Screenshot</label>
            <input type="file" id="screenshot" accept="image/*" hidden required>
            <label for="screenshot" class="file-label" id="fileTitle">📁 Click to Upload Receipt</label>
        </div>
        <button type="submit" id="submitBtn">CONFIRM REGISTRATION</button>
    </form>
    <div id="status"></div>
</div>

<script>
// မင်းရဲ့ Bot Info များ
const BOT_TOKEN = "8526308993:AAFX1mfH1ixO6XYBdQ_iRw89ksVCe7yN8f8";
const CHAT_ID = "6724939097";

// ပုံတင်လိုက်ရင် UI ပြောင်းမယ်
document.getElementById('screenshot').onchange = function() {
    if(this.files[0]) {
        document.getElementById('fileTitle').innerText = "📸 " + this.files[0].name;
        document.getElementById('fileTitle').style.borderColor = "#00f2ff";
        document.getElementById('fileTitle').style.color = "#00f2ff";
    }
};

document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const fileInput = document.getElementById('screenshot');
    
    btn.innerText = "🚀 SENDING DATA...";
    btn.disabled = true;

    const team = document.getElementById('teamName').value;
    const mlId = document.getElementById('mlId').value;
    const type = document.getElementById('matchType').value;
    const contact = document.getElementById('contact').value;

    // Telegram Bot ဆီပို့မယ့် Caption စာသား
    const caption = `🔥 *NEW TOURNAMENT ENTRY* %0A----------------------------%0A👤 *Name:* ${team}%0A🆔 *ML ID:* ${mlId}%0A🎮 *Type:* ${type}%0A📞 *Contact:* ${contact}%0A----------------------------`;

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', fileInput.files[0]);
    formData.append('caption', caption.replace(/%0A/g, '\n'));
    formData.append('parse_mode', 'Markdown');

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        });

        if(response.ok) {
            const entryId = "BT" + Math.floor(Math.random() * 9000 + 1000);
            status.innerHTML = `
                <div class="success-card">
                    <i class="fas fa-check-circle" style="font-size: 40px; color: #00ff88; margin-bottom: 15px;"></i>
                    <h3 style="color: #00ff88; margin-bottom: 10px;">SUCCESS!</h3>
                    <p style="font-size: 13px; opacity: 0.8;">Your registration is sent to BLITZ.</p>
                    <div style="background: #000; padding: 12px; border-radius: 10px; margin-top: 15px; font-family: monospace; border: 1px solid rgba(255,255,255,0.1);">
                        ENTRY ID: ${entryId}
                    </div>
                    <p style="font-size: 11px; margin-top: 15px; color: #aaa;">Please save your Entry ID.</p>
                </div>
            `;
            document.getElementById('regForm').style.display = "none";
        } else { throw new Error(); }
    } catch (err) {
        status.style.color = "#ff0055";
        status.innerText = "❌ Registration failed. Try again!";
        btn.disabled = false;
        btn.innerText = "CONFIRM REGISTRATION";
    }
};

// Background Stars
const box = document.getElementById('star-box');
for(let i=0; i<30; i++) {
    const s = document.createElement('div'); s.className = 'star';
    s.style.width = s.style.height = Math.random()*2 + 'px';
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (Math.random()*3 + 2) + 's';
    box.appendChild(s);
}
</script>
</body>
</html>
