<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLITZ ARENA | PRO BRACKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2ff; --bg: #08090b; --card: rgba(255,255,255,0.03); --border: rgba(0, 242, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: auto; padding: 40px; }
        
        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-family: 'Syncopate'; color: var(--main); letter-spacing: 5px; text-transform: uppercase; }

        /* 📊 Stats Bar */
        .info-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 60px; }
        .info-item { background: var(--card); padding: 15px 25px; border-radius: 12px; border-bottom: 3px solid var(--main); min-width: 180px; text-align: center; }
        .info-item span { font-size: 10px; color: #888; display: block; text-transform: uppercase; margin-bottom: 5px; }
        .info-item b { font-family: 'Syncopate'; color: var(--main); font-size: 14px; }

        /* 🏆 M-Series Style Bracket */
        .bracket { display: flex; gap: 50px; align-items: flex-start; min-width: max-content; padding-bottom: 50px; }
        .round { display: flex; flex-direction: column; gap: 30px; }
        .round-title { font-family: 'Syncopate'; font-size: 10px; color: #444; margin-bottom: 20px; text-align: center; letter-spacing: 2px; }

        .match { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 170px; position: relative; transition: 0.3s; }
        .match:hover { border-color: var(--main); background: rgba(0, 242, 255, 0.05); }
        
        .team { padding: 12px; font-weight: bold; color: #555; height: 45px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .team:last-child { border: none; }
        .team.active { color: var(--main); }

        /* Connector Lines */
        .match::after { content: ""; position: absolute; right: -50px; top: 50%; width: 50px; height: 1px; background: var(--main); opacity: 0.2; }
        .round:last-child .match::after { display: none; }

        /* Different Gap for Each Round to align perfectly */
        .round-1 { gap: 30px; }
        .round-2 { gap: 120px; padding-top: 40px; }
        .round-3 { gap: 300px; padding-top: 130px; }
        .round-4 { gap: 600px; padding-top: 310px; }
        .round-5 { padding-top: 310px; } /* Champion */

        .champ-card { border: 2px solid #ff0055 !important; box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
        .champ-card .team { color: #ff0055 !important; font-family: 'Syncopate'; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header"><h1>BLITZ ARENA</h1></div>

    <div class="info-bar">
        <div class="info-item"><span>Prize Pool</span><b id="prize">Loading...</b></div>
        <div class="info-item"><span>Match Date</span><b id="date">Loading...</b></div>
    </div>

    <div class="bracket">
        <div class="round round-1">
            <div class="round-title">Round 1</div>
            <div class="match"><div class="team" id="t1">TBA</div><div class="team" id="t2">TBA</div></div>
            <div class="match"><div class="team" id="t3">TBA</div><div class="team" id="t4">TBA</div></div>
            <div class="match"><div class="team" id="t5">TBA</div><div class="team" id="t6">TBA</div></div>
            <div class="match"><div class="team" id="t7">TBA</div><div class="team" id="t8">TBA</div></div>
            <div class="match"><div class="team" id="t9">TBA</div><div class="team" id="t10">TBA</div></div>
            <div class="match"><div class="team" id="t11">TBA</div><div class="team" id="t12">TBA</div></div>
            <div class="match"><div class="team" id="t13">TBA</div><div class="team" id="t14">TBA</div></div>
            <div class="match"><div class="team" id="t15">TBA</div><div class="team" id="t16">TBA</div></div>
        </div>

        <div class="round round-2">
            <div class="round-title">Quarter Finals</div>
            <div class="match"><div class="team" id="t17">TBA</div><div class="team" id="t18">TBA</div></div>
            <div class="match"><div class="team" id="t19">TBA</div><div class="team" id="t20">TBA</div></div>
            <div class="match"><div class="team" id="t21">TBA</div><div class="team" id="t22">TBA</div></div>
            <div class="match"><div class="team" id="t23">TBA</div><div class="team" id="t24">TBA</div></div>
        </div>

        <div class="round round-3">
            <div class="round-title">Semi Finals</div>
            <div class="match"><div class="team" id="t25">TBA</div><div class="team" id="t26">TBA</div></div>
            <div class="match"><div class="team" id="t27">TBA</div><div class="team" id="t28">TBA</div></div>
        </div>

        <div class="round round-4">
            <div class="round-title">Grand Final</div>
            <div class="match"><div class="team" id="t29">TBA</div><div class="team" id="t30">TBA</div></div>
        </div>

        <div class="round round-5">
            <div class="round-title">Champion</div>
            <div class="match champ-card"><div class="team" id="t31">🏆 TBA</div></div>
        </div>
    </div>

    <script>
        const S_ID = "158_hGCRjHiq0a-TTBOLoCg2Uu5WthdoVEe_gXWpQNws";
        async function load() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:json`);
                const text = await res.text();
                const json = JSON.parse(text.substr(47).slice(0,-2));
                const d = json.table.rows;

                // Prize & Date
                document.getElementById('prize').innerText = d[0]?.c[1]?.v || "TBA";
                document.getElementById('date').innerText = d[0]?.c[2]?.v || "TBA";

                // Map all 31 Slots
                for(let i=1; i<=31; i++) {
                    const el = document.getElementById('t'+i);
                    const val = d[i-1]?.c[0]?.v || "TBA";
                    el.innerText = i === 31 ? "🏆 " + val : val;
                    if(val !== "TBA") el.classList.add('active');
                    else el.classList.remove('active');
                }
            } catch (e) { console.log("Sync Error"); }
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
