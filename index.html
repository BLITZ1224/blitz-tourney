<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BLITZ ARENA | SMART BRACKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2ff; --bg: #08090b; --card: rgba(255,255,255,0.03); }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: auto; padding: 40px; }
        .info { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; }
        .box { background: var(--card); padding: 12px 20px; border-radius: 8px; border-bottom: 2px solid var(--main); font-size: 14px; }
        
        .bracket { display: flex; gap: 50px; align-items: flex-start; min-width: max-content; }
        .round { display: flex; flex-direction: column; gap: 20px; justify-content: space-around; }
        .round-title { font-family: 'Syncopate'; font-size: 10px; color: #555; text-align: center; margin-bottom: 15px; letter-spacing: 2px; }
        
        .match { background: var(--card); border: 1px solid rgba(0,242,255,0.1); border-radius: 8px; width: 170px; position: relative; }
        .team { padding: 12px; font-weight: bold; color: var(--main); height: 45px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .team:last-child { border: none; }
        
        /* Connector Lines */
        .match::after { content: ""; position: absolute; right: -50px; top: 50%; width: 50px; height: 1px; background: var(--main); opacity: 0.2; }
        .round:last-child .match::after { display: none; }
    </style>
</head>
<body>

    <div class="info">
        <div class="box">PRIZE: <b id="p">Loading...</b></div>
        <div class="box">DATE: <b id="d">Loading...</b></div>
    </div>

    <div id="bUI" class="bracket"></div>

    <script>
        const S_ID = "158_hGCRjHiq0a-TTBOLoCg2Uu5WthdoVEe_gXWpQNws";

        async function load() {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:json`);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0,-2));
            const rows = json.table.rows;

            document.getElementById('p').innerText = rows[0]?.c[1]?.v || "TBA";
            document.getElementById('d').innerText = rows[0]?.c[2]?.v || "TBA";

            // Column A ထဲမှာ "TBA" မဟုတ်တဲ့ တကယ်ရှိတဲ့ အသင်းတွေကိုပဲ ယူမယ်
            const teams = rows.map(r => r.c[0]?.v).filter(v => v && v !== "TBA");
            render(teams);
        }

        function render(teams) {
            const ui = document.getElementById('bUI');
            ui.innerHTML = "";
            if (teams.length === 0) return;

            let currentRoundTeams = teams;
            let roundCount = 1;

            while (currentRoundTeams.length > 0) {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.innerHTML = `<div class="round-title">ROUND ${roundCount}</div>`;

                for (let i = 0; i < currentRoundTeams.length; i += 2) {
                    const m = document.createElement('div');
                    m.className = 'match';
                    m.innerHTML = `
                        <div class="team">${currentRoundTeams[i]}</div>
                        <div class="team">${currentRoundTeams[i+1] || "WAITING"}</div>
                    `;
                    roundDiv.appendChild(m);
                }
                ui.appendChild(roundDiv);

                if (currentRoundTeams.length <= 1) break;
                // နောက်တစ်ဆင့်အတွက် အကွက်အရေအတွက်ကို တစ်ဝက်လျှော့
                currentRoundTeams = new Array(Math.ceil(currentRoundTeams.length / 2)).fill("TBA");
                roundCount++;
            }
        }
        load(); setInterval(load, 30000);
    </script>
</body>
</html>
