<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLITZ | Tournament Register</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Syncopate:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{ --c1:#00f2ff; --c2:#ff0055; --bg:#0b0c10; }
*{margin:0;padding:0;box-sizing:border-box;}
body{ min-height:100vh; font-family:'Outfit',sans-serif; display:flex; justify-content:center; align-items:center; background: var(--bg); color:#fff; padding: 20px; }

.form-card { width:min(100%, 450px); background:rgba(20,22,28,0.95); padding:35px 25px; border-radius:30px; border: 1px solid rgba(255,255,255,0.15); position: relative; z-index: 1; box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
h2 { font-family:'Syncopate'; text-align:center; color:var(--c1); margin-bottom:30px; font-size: 20px; letter-spacing: 2px; text-shadow: 0 0 10px var(--c1); }

.input-group { margin-bottom: 22px; }
label { display:block; font-size:13px; margin-bottom:10px; color:#ffffff; font-weight: 700; text-transform: uppercase; }

/* 🌟 Match Type (SOLO / SQ) ကို ပိုလင်းအောင်လုပ်ထားတဲ့ Style */
.match-select { 
    width:100%; padding:16px; border-radius:12px; 
    border: 2px solid var(--c1); /* ပိုမြင်သာအောင် Border အထူထားတယ် */
    background:rgba(0, 242, 255, 0.1); /* Background အရောင်ဖျော့လေးထည့်ထားတယ် */
    color:#ffffff; outline:none; font-size: 16px; font-weight: 900; 
    cursor: pointer; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
}

input { width:100%; padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.5); color:#ffffff; outline:none; font-size: 14px; }
input:focus { border-color: var(--c1); }

.file-label { display: block; padding: 20px; border: 2px dashed rgba(255,255,255,0.3); border-radius: 15px; text-align: center; cursor: pointer; color: #ffffff; font-weight: 600; background: rgba(255,255,255,0.03); }

button { width:100%; padding:18px; border-radius:15px; border:none; background: linear-gradient(90deg, var(--c1), var(--c2)); color:#fff; font-weight:900; cursor:pointer; margin-top:10px; font-size: 15px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="form-card">
    <h2>🏆 REGISTER</h2>
    <form id="regForm">
        <div class="input-group">
            <label><i class="fas fa-user-edit"></i> Team / Player Name</label>
            <input type="text" id="teamName" placeholder="Enter name" required>
        </div>
        
        <div class="input-group">
            <label><i class="fas fa-id-badge"></i> Game ID</label>
            <input type="text" id="mlId" placeholder="Example: 1036720164" required>
        </div>

        <div class="input-group">
            <label style="color: var(--c1);"><i class="fas fa-star"></i> SELECT MATCH TYPE (SOLO / SQ)</label>
            <select id="matchType" class="match-select">
                <option value="1vs1 Solo" style="color: #000;">🔥 1 vs 1 (SOLO MATCH)</option>
                <option value="5vs5 Squad" style="color: #000;">⚔️ 5 vs 5 (SQUAD MATCH)</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fab fa-facebook-messenger"></i> Contact Info</label>
            <input type="text" id="contact" placeholder="Messenger link or Phone" required>
        </div>

        <div class="input-group">
            <label><i class="fas fa-file-invoice-dollar"></i> Payment Receipt (Screenshot)</label>
            <input type="file" id="screenshot" accept="image/*" hidden required>
            <label for="screenshot" class="file-label" id="fileTitle">📁 Upload KPay / Wave Screenshot</label>
        </div>

        <button type="submit" id="submitBtn">CONFIRM REGISTRATION</button>
    </form>
    <div id="status"></div>
</div>

<script>
const BOT_TOKEN = "8526308993:AAFX1mfH1ixO6XYBdQ_iRw89ksVCe7yN8f8";
const CHAT_ID = "6724939097";

document.getElementById('screenshot').onchange = function() {
    if(this.files[0]) {
        document.getElementById('fileTitle').innerText = "✅ " + this.files[0].name;
        document.getElementById('fileTitle').style.borderColor = "#00f2ff";
    }
};

document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const fileInput = document.getElementById('screenshot');
    
    btn.innerText = "SENDING TO BLITZ...";
    btn.disabled = true;

    const team = document.getElementById('teamName').value;
    const mlId = document.getElementById('mlId').value;
    const type = document.getElementById('matchType').value;
    const contact = document.getElementById('contact').value;

    const caption = `🔥 *NEW TOURNAMENT ENTRY*%0A👤 *Name:* ${team}%0A🆔 *Game ID:* ${mlId}%0A🎮 *Type:* ${type}%0A📞 *Contact:* ${contact}`;

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', fileInput.files[0]);
    formData.append('caption', caption.replace(/%0A/g, '\n'));
    formData.append('parse_mode', 'Markdown');

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST', body: formData
        });
        if(response.ok) {
            status.innerHTML = `<div style="padding:20px; border:2px solid #00ff88; border-radius:15px; background:rgba(0,255,136,0.1); color:#00ff88;"><h3>SUCCESS!</h3><p>Entry ID: #BT${Math.floor(Math.random()*9000+1000)}</p></div>`;
            document.getElementById('regForm').style.display = "none";
        }
    } catch (err) {
        status.innerText = "❌ Error! Try again.";
        btn.disabled = false;
    }
};
</script>
</body>
</html>
