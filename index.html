<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BLITZ ARENA | M-SERIES STYLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2ff; --bg: #08090b; }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: auto; padding: 40px; }
        .info { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; }
        .box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border-bottom: 2px solid var(--main); }

        /* 🏆 Pro Bracket Layout */
        .bracket { display: flex; gap: 60px; align-items: flex-start; }
        .round { display: flex; flex-direction: column; gap: 30px; }
        .match { background: rgba(255,255,255,0.02); border: 1px solid rgba(0,242,255,0.1); border-radius: 8px; width: 180px; position: relative; }
        .team { padding: 12px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); color: #aaa; height: 45px; display: flex; align-items: center; }
        .team.active { color: var(--main); }
        .team:last-child { border: none; }
        
        /* Connector Lines */
        .match::after { content: ""; position: absolute; right: -60px; top: 50%; width: 60px; height: 1px; background: var(--main); opacity: 0.2; }
        .round:last-child .match::after { display: none; }
        
        .round-title { font-family: 'Syncopate'; font-size: 10px; color: #555; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="info">
        <div class="box">PRIZE: <b id="p">Loading...</b></div>
        <div class="box">DATE: <b id="d">Loading...</b></div>
    </div>

    <div class="bracket" id="bUI"></div>

    <script>
        const S_ID = "158_hGCRjHiq0a-TTBOLoCg2Uu5WthdoVEe_gXWpQNws";
        async function load() {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:json`);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0,-2));
            const data = json.table.rows;

            document.getElementById('p').innerText = data[0]?.c[1]?.v || "TBA";
            document.getElementById('d').innerText = data[0]?.c[2]?.v || "TBA";

            const teams = data.map(r => r.c[0]?.v || "");
            render(teams);
        }

        function render(allTeams) {
            const ui = document.getElementById('bUI');
            ui.innerHTML = "";
            
            // MLBB M-Series Style Logic (၄၊ ၈၊ ၁၆ ပုံစံဖြတ်မည်)
            let roundSize = 0;
            if (allTeams.length <= 4) roundSize = 4;
            else if (allTeams.length <= 8) roundSize = 8;
            else roundSize = 16;

            let startIndex = 0;
            let roundLabel = ["Round 1", "Quarter Finals", "Semi Finals", "Grand Final", "Champion"];
            let labelIdx = 0;

            while (roundSize >= 1) {
                const round = document.createElement('div');
                round.className = 'round';
                round.innerHTML = `<div class="round-title">${roundLabel[labelIdx] || "Stage"}</div>`;

                for (let i = 0; i < roundSize; i += 2) {
                    const m = document.createElement('div');
                    m.className = 'match';
                    const t1 = allTeams[startIndex + i] || "TBA";
                    const t2 = allTeams[startIndex + i + 1] || "TBA";
                    
                    m.innerHTML = `
                        <div class="team ${t1 !== "TBA" ? 'active' : ''}">${t1}</div>
                        <div class="team ${t2 !== "TBA" ? 'active' : ''}">${t2}</div>
                    `;
                    round.appendChild(m);
                }
                ui.appendChild(round);
                
                startIndex += roundSize;
                roundSize /= 2;
                labelIdx++;

                if (roundSize < 1 && startIndex < allTeams.length) {
                    const winRound = document.createElement('div');
                    winRound.className = 'round';
                    winRound.innerHTML = `<div class="round-title">Winner</div><div class="match" style="border-color:var(--main)"><div class="team active">🏆 ${allTeams[startIndex]}</div></div>`;
                    ui.appendChild(winRound);
                    break;
                }
            }
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
