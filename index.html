<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>BLITZ ARENA | OFFICIAL SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00f2ff; --bg: #08090b; --card: rgba(255,255,255,0.03); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: auto; }
        
        header { padding: 40px 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h1 { font-family: 'Syncopate'; color: var(--main); letter-spacing: 5px; text-shadow: 0 0 15px var(--main); }

        /* Stats Bar */
        .info-bar { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .info-box { background: var(--card); padding: 15px 25px; border-radius: 12px; border-bottom: 3px solid var(--main); min-width: 150px; text-align: center; }
        .info-box span { font-size: 10px; color: #888; display: block; text-transform: uppercase; }
        .info-box b { font-family: 'Syncopate'; font-size: 14px; color: var(--main); }

        /* 🏆 Dynamic Bracket UI */
        .bracket-container { display: flex; gap: 60px; padding: 40px; justify-content: flex-start; min-width: max-content; }
        .round { display: flex; flex-direction: column; justify-content: space-around; gap: 20px; }
        .match { background: var(--card); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 10px; width: 180px; padding: 10px; position: relative; }
        .team { padding: 10px; color: var(--main); font-weight: bold; min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; }
        .team:first-child { border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Connector Lines */
        .match::after { content: ""; position: absolute; right: -60px; top: 50%; width: 60px; height: 1px; background: var(--main); opacity: 0.3; }
        .round:last-child .match::after { display: none; }

        /* Champion Highlight */
        .round:last-child .match { border: 2px solid #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
        .round:last-child .team { color: #ff0055; font-family: 'Syncopate'; font-size: 12px; }
    </style>
</head>
<body>

    <header><h1>BLITZ ARENA</h1></header>

    <div class="info-bar">
        <div class="info-box"><span>Prize Pool</span><b id="prize">Loading...</b></div>
        <div class="info-box"><span>Match Date</span><b id="date">Loading...</b></div>
    </div>

    <div class="bracket-container" id="bracketUI">
        </div>

    <script>
        // ⚠️ မင်းရဲ့ Google Sheet ID ကိုပဲ ဒီမှာ ထည့်ပါ
        const SHEET_ID = "158_hGCRjHiq0a-TTBOLoCg2Uu5WthdoVEe_gXWpQNws";

        async function syncData() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
                const text = await res.text();
                const json = JSON.parse(text.substr(47).slice(0,-2));
                const rows = json.table.rows;

                // Prize & Date (Column B, C)
                document.getElementById('prize').innerText = rows[0].c[1]?.v || "TBA";
                document.getElementById('date').innerText = rows[0].c[2]?.v || "TBA";

                // အသင်းဒေတာများ (Column A တစ်ခုလုံး)
                const allData = rows.map(r => r.c[0]?.v || "TBA");
                buildBracket(allData);
            } catch (e) { console.error("Update Failed"); }
        }

        function buildBracket(data) {
            const container = document.getElementById('bracketUI');
            container.innerHTML = "";
            
            // Logic: အသင်းအရေအတွက်ပေါ်မူတည်ပြီး Round တွေကို တွက်ချက်ခြင်း
            // ၄ သင်း = ၂ ဆင့်၊ ၈ သင်း = ၃ ဆင့်၊ ၁၆ သင်း = ၄ ဆင့်
            let currentLevelData = [...data];
            let teamsInRound = 0;

            // ပထမဆင့်မှာ ဘယ်နှစ်သင်းရှိလဲ သိအောင်အရင်ရှာ (ဥပမာ- ၄ သင်းပြိုင်ပွဲဆိုရင် ပထမဆုံး ၄ ကွက်ယူမယ်)
            // ဒီ Code က ၄၊ ၈၊ ၁၆၊ ၃၂ အကုန်အလုပ်လုပ်ပါတယ်
            const totalEntries = data.length;
            if (totalEntries <= 7) teamsInRound = 4;
            else if (totalEntries <= 15) teamsInRound = 8;
            else if (totalEntries <= 31) teamsInRound = 16;
            else teamsInRound = 32;

            let startIndex = 0;
            while (teamsInRound >= 1) {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                
                const currentRoundData = data.slice(startIndex, startIndex + teamsInRound);
                
                for (let i = 0; i < currentRoundData.length; i += 2) {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'match';
                    matchDiv.innerHTML = `
                        <div class="team">${currentRoundData[i] || "TBA"}</div>
                        <div class="team">${currentRoundData[i+1] || "TBA"}</div>
                    `;
                    roundDiv.appendChild(matchDiv);
                }
                
                container.appendChild(roundDiv);
                startIndex += teamsInRound;
                teamsInRound = teamsInRound / 2;
                if (teamsInRound < 1 && startIndex < data.length) {
                    // Final Champion အကွက်ရှိရင် ထည့်မယ်
                    const champRound = document.createElement('div');
                    champRound.className = 'round';
                    champRound.innerHTML = `<div class="match"><div class="team">🏆 ${data[startIndex]}</div></div>`;
                    container.appendChild(champRound);
                    break;
                }
            }
        }

        syncData();
        setInterval(syncData, 60000); // ၁ မိနစ်တစ်ခါ Auto Update လုပ်မယ်
    </script>
</body>
</html>
