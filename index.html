<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>BLITZ ARENA | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --main: #00f2ff; --accent: #ff0055; --bg: #08090b; --card: rgba(255,255,255,0.03); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }

        /* 🌌 Background Effect */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #08090b 100%); z-index: -1; }

        header { padding: 50px 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h1 { font-family: 'Syncopate'; font-weight: 900; color: var(--main); letter-spacing: 8px; text-shadow: 0 0 20px rgba(0, 242, 255, 0.4); font-size: 2.5rem; }

        /* 📊 Admin Stats Bar */
        .admin-stats { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .stat-item { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(0, 242, 255, 0.1); min-width: 180px; flex: 1; transition: 0.3s; }
        .stat-item:hover { border-color: var(--main); transform: translateY(-5px); }
        .stat-item span { font-size: 10px; color: #888; display: block; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .stat-item b { color: var(--main); font-family: 'Syncopate'; font-size: 16px; letter-spacing: 1px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .section-title { font-family: 'Syncopate'; font-size: 14px; color: var(--main); margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ""; height: 1px; flex-grow: 1; background: linear-gradient(90deg, var(--main), transparent); }

        /* 🏆 Professional Bracket UI */
        .bracket-wrapper { display: flex; align-items: center; justify-content: center; gap: 50px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .round { display: flex; flex-direction: column; gap: 50px; }
        .match-card { background: var(--card); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 12px; width: 180px; position: relative; overflow: hidden; }
        .team-slot { padding: 15px; font-weight: 700; color: #fff; text-align: center; position: relative; transition: 0.3s; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .team-slot:last-child { border: none; }
        .team-slot.loading { color: #444; font-style: italic; }
        .match-card::after { content: "VS"; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); background: #08090b; color: var(--main); font-size: 8px; padding: 4px; border: 1px solid var(--main); border-radius: 4px; z-index: 2; font-family: 'Syncopate'; }

        /* ✍️ Form Styling */
        .reg-card { background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 25px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .field { margin-bottom: 20px; }
        label { font-size: 11px; color: #888; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--main); background: rgba(0, 242, 255, 0.05); }
        .submit-btn { width: 100%; padding: 20px; background: var(--main); color: #000; border: none; border-radius: 12px; font-weight: 900; font-family: 'Syncopate'; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--main); }
        
        #msg { margin-top: 20px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>BLITZ ARENA</h1>
    </header>

    <div class="admin-stats">
        <div class="stat-item"><span>Prize Pool</span><b id="prizeTxt">Loading...</b></div>
        <div class="stat-item"><span>Match Date</span><b id="dateTxt">Loading...</b></div>
        <div class="stat-item"><span>Tournament Status</span><b>LIVE</b></div>
    </div>

    <div class="container">
        <div class="bracket-side">
            <div class="section-title">Tournament Bracket</div>
            <div class="bracket-wrapper">
                <div class="round">
                    <div class="match-card">
                        <div class="team-slot" id="t1">Team 1</div>
                        <div class="team-slot" id="t2">Team 2</div>
                    </div>
                    <div class="match-card">
                        <div class="team-slot" id="t3">Team 3</div>
                        <div class="team-slot" id="t4">Team 4</div>
                    </div>
                </div>
                <div class="round">
                    <div class="match-card" style="border-color: var(--accent);">
                        <div class="team-slot" style="color: var(--accent);">Winner M1</div>
                        <div class="team-slot" style="color: var(--accent);">Winner M2</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-side">
            <div class="section-title">Registration</div>
            <div class="reg-card">
                <form id="regForm">
                    <div class="field"><label>Team Name</label><input type="text" id="teamName" placeholder="Enter Team Name" required></div>
                    <div class="field"><label>Leader MLBB ID</label><input type="text" id="mlId" placeholder="e.g. 1036720164" required></div>
                    <div class="field"><label>Contact (Messenger)</label><input type="url" id="fbLink" placeholder="Facebook Profile Link" required></div>
                    <div class="field"><label>Payment Screenshot</label><input type="file" id="receipt" accept="image/*" required></div>
                    <button type="submit" class="submit-btn" id="subBtn">SUBMIT ENTRY</button>
                </form>
                <div id="msg"></div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ မင်းရဲ့ အချက်အလက်များ
        const SHEET_ID = "158_hGCRjHiq0a-TTBOLoCg2Uu5WthdoVEe_gXWpQNws";
        const BOT_TOKEN = "8526308993:AAFX1mfH1ixO6XYBdQ_iRw89ksVCe7yN8f8";
        const CHAT_ID = "6724939097";

        // 🔄 Sync Data From Google Sheet (Controlled by Bot)
        async function syncWithBot() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const data = json.table.rows[0].c;

                // Sheet ထဲက data များကို Website တွင် ပြခြင်း
                document.getElementById('t1').innerText = data[0]?.v || "TBA";
                document.getElementById('t2').innerText = data[1]?.v || "TBA";
                document.getElementById('t3').innerText = data[2]?.v || "TBA";
                document.getElementById('t4').innerText = data[3]?.v || "TBA";
                document.getElementById('prizeTxt').innerText = data[4]?.v || "TBA";
                document.getElementById('dateTxt').innerText = data[5]?.v || "TBA";
            } catch (err) { console.error("Sync Error:", err); }
        }
        syncWithBot();
        setInterval(syncWithBot, 30000); // ၃၀ စက္ကန့်တစ်ခါ Bot ရဲ့ update ကို စစ်မည်

        // 📤 Form Submit to Telegram with Approve/Reject Buttons
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.innerText = "SENDING..."; btn.disabled = true;

            const tName = document.getElementById('teamName').value;
            const mId = document.getElementById('mlId').value;
            const fb = document.getElementById('fbLink').value;

            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', document.getElementById('receipt').files[0]);
            fd.append('caption', `🔥 *NEW REGISTRATION*\n\n🏆 Team: ${tName}\n🆔 ID: ${mId}\n📞 Contact: ${fb}`);
            
            // Bot ထဲတွင် Approve/Reject ခလုတ်များ ပေါ်စေရန်
            const keyboard = {
                inline_keyboard: [[
                    { text: "✅ Approve", callback_data: `app|${tName}|${mId}` },
                    { text: "❌ Reject", callback_data: `rej|${tName}|${mId}` }
                ]]
            };
            fd.append('reply_markup', JSON.stringify(keyboard));

            try {
                const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                if(r.ok) {
                    document.getElementById('msg').innerHTML = "<span style='color:var(--main)'>✅ Entry Sent! Admin will review soon.</span>";
                    document.getElementById('regForm').reset();
                }
            } catch (err) { alert("Submission Error!"); }
            btn.innerText = "SUBMIT ENTRY"; btn.disabled = false;
        };
    </script>
</body>
</html>
